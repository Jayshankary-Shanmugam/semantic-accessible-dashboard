<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Components</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Accessible Components</h1>

        <nav aria-label="Main navigation">
            <a href="index.html">Dashboard</a>
            <a href="components.html">Components</a>
        </nav>
    </header>

    <main>

        <section aria-labelledby="form-title">

            <h2 id="form-title">User Registration Form</h2>

            <form action="#" method="post">

                <fieldset>

                    <legend>Personal Information</legend>

                    <div>
                        <label for="full-name">Full Name</label>
                        <input
                            type="text"
                            id="full-name"
                            name="full-name"
                            aria-label="Full Name"
                            required
                            minlength="2"
                            autocomplete="name"
                        >
                    </div>

                    <div>
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            aria-label="Email Address"
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div>
                        <label for="department">Department</label>

                        <select
                            id="department"
                            name="department"
                            aria-label="Department"
                            required
                        >
                            <option value="">Select Department</option>
                            <option value="development">Development</option>
                            <option value="datascience">Data Science</option>
                            <option value="management">Management</option>
                        </select>
                    </div>

                </fieldset>

                <fieldset>

                    <legend>Account Preferences</legend>

                    <div>
                        <input
                            type="checkbox"
                            id="notifications"
                            name="notifications"
                        >

                        <label for="notifications">
                            Receive email notifications
                        </label>
                    </div>

                </fieldset>

                <button type="submit">
                    Submit Registration
                </button>

            </form>

        </section>


        <section aria-labelledby="modal-title">

            <h2 id="modal-title">Accessible Modal Dialog</h2>

            <button
                type="button"
                id="open-modal"
                aria-haspopup="dialog"
            >
                Open Information Dialog
            </button>

            <dialog
                id="info-dialog"
                aria-labelledby="dialog-heading"
            >

                <h3 id="dialog-heading">
                    Dashboard Information
                </h3>

                <p>
                    This dialog demonstrates an accessible
                    HTML5 modal component.
                </p>

                <button
                    type="button"
                    id="close-modal"
                >
                    Close Dialog
                </button>

            </dialog>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Accessible Enterprise Dashboard</p>
    </footer>

    <script>
        const dialog = document.getElementById("info-dialog");
        const openButton = document.getElementById("open-modal");
        const closeButton = document.getElementById("close-modal");

        openButton.addEventListener("click", () => {
            dialog.showModal();
        });

        closeButton.addEventListener("click", () => {
            dialog.close();
        });
    </script>

</body>
</html>
